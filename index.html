<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cola Lab — Classifica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://mdcwynozeugxxmcrgwra.supabase.co/rest/v1/"></script>
<style>
  :root{
    --coal: #170d07;
    --surface: #241409;
    --surface-2: #2f1a0d;
    --copper: #b5651d;
    --copper-bright: #d98a3d;
    --fizz: #d4e157;
    --cream: #f2e8d5;
    --cream-dim: #c9bda6;
    --rust: #8b3a2f;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(181,101,29,0.18), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(212,225,87,0.06), transparent 55%),
      var(--coal);
    color:var(--cream);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:80px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 24px;}

  header{padding:72px 0 40px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--copper-bright);
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(40px, 7vw, 68px);
    line-height:0.98;
    margin:0 0 16px;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--fizz);}
  .lede{
    font-size:16px;
    color:var(--cream-dim);
    max-width:52ch;
    line-height:1.55;
  }

  .board{
    background:var(--surface);
    border:1px solid rgba(242,232,213,0.08);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .row{
    display:grid;
    grid-template-columns:56px 1fr auto 140px;
    gap:18px;
    align-items:center;
    padding:20px 22px;
    border-bottom:1px solid rgba(242,232,213,0.07);
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .row:hover{background:var(--surface-2);}
  .row:last-child{border-bottom:none;}

  .rank{
    width:40px;height:40px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--copper-bright), var(--copper) 70%);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--coal);
    box-shadow: inset 0 -3px 4px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.4);
    position:relative;
  }
  .rank::after{
    content:'';
    position:absolute;
    inset:5px;
    border-radius:50%;
    border:1.5px dashed rgba(23,13,7,0.35);
  }

  .info .name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
  }
  .info .meta{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--cream-dim);
    margin-top:4px;
  }

  .score-num{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:24px;
    text-align:right;
  }
  .score-num small{
    font-size:12px;
    font-weight:400;
    color:var(--cream-dim);
  }

  .fizz-meter{
    display:flex;
    gap:3px;
    justify-content:flex-end;
  }
  .bubble{
    width:9px;height:9px;
    border-radius:50%;
    background:rgba(242,232,213,0.12);
  }
  .bubble.on{
    background:var(--fizz);
    box-shadow:0 0 6px rgba(212,225,87,0.5);
  }

  .detail{
    display:none;
    padding:4px 22px 22px 98px;
    background:var(--surface-2);
    border-bottom:1px solid rgba(242,232,213,0.07);
  }
  .detail.open{display:block;}
  .detail table{
    width:100%;
    border-collapse:collapse;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
  }
  .detail th{
    text-align:left;
    color:var(--copper-bright);
    font-weight:500;
    padding:8px 10px;
    border-bottom:1px solid rgba(242,232,213,0.1);
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-size:11px;
  }
  .detail td{
    padding:8px 10px;
    border-bottom:1px solid rgba(242,232,213,0.05);
    color:var(--cream-dim);
  }
  .detail td:first-child{color:var(--cream);}

  .empty, .loading{
    padding:60px 22px;
    text-align:center;
    color:var(--cream-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
  }

  footer{
    max-width:920px;margin:40px auto 0;padding:0 24px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--cream-dim);
    opacity:0.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Registro di degustazione &middot; 4 assaggiatori</div>
      <h1>cheses<span>COLA</span>amo</h1>
      <p class="lede">Ogni bottiglia comprata, assaggiata e votata su gusto, retrogusto e frizzantezza. Il punteggio finale è una media pesata tra tutti gli assaggiatori.</p>
    </header>

    <div class="board" id="board">
      <div class="loading">Caricamento classifica&hellip;</div>
    </div>
  </div>

  <footer class="wrap">Pesi: gusto 50% &middot; retrogusto 30% &middot; frizzantezza 20%</footer>

<script>
  // ---- CONFIGURAZIONE: inserisci qui i dati del tuo progetto Supabase ----
  const SUPABASE_URL = 'https://TUO-PROGETTO.supabase.co';
  const SUPABASE_ANON_KEY = 'TUA-CHIAVE-ANON-PUBBLICA';
  // --------------------------------------------------------------------

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const board = document.getElementById('board');

  function bubbleMeter(score){
    const filled = Math.round((score / 10) * 10);
    let html = '<div class="fizz-meter">';
    for(let i=0;i<10;i++){
      html += `<div class="bubble ${i < filled ? 'on' : ''}"></div>`;
    }
    html += '</div>';
    return html;
  }

  async function loadBoard(){
    const { data: overall, error } = await supabase
      .from('cola_overall')
      .select('*')
      .order('overall_score', { ascending: false, nullsFirst: false });

    if (error) {
      board.innerHTML = `<div class="empty">Errore nel caricamento: ${error.message}</div>`;
      return;
    }
    if (!overall || overall.length === 0) {
      board.innerHTML = `<div class="empty">Ancora nessuna cola in classifica. Aggiungine una al database.</div>`;
      return;
    }

    const { data: details } = await supabase
      .from('cola_ratings_detail')
      .select('*');

    board.innerHTML = overall.map((c, idx) => {
      const rows = (details || []).filter(d => d.cola_id === c.id);
      const detailRows = rows.map(r => `
        <tr>
          <td>${r.person_name}</td>
          <td>${r.taste}</td>
          <td>${r.aftertaste}</td>
          <td>${r.fizziness}</td>
          <td>${r.overall}</td>
          <td>${r.comment ?? '—'}</td>
        </tr>
      `).join('');

      return `
        <div class="row" onclick="document.getElementById('d-${c.id}').classList.toggle('open')">
          <div class="rank">${idx + 1}</div>
          <div class="info">
            <div class="name">${c.name}${c.brand ? ` <span style="color:var(--cream-dim);font-weight:400;font-size:15px;">— ${c.brand}</span>` : ''}</div>
            <div class="meta">&euro;${Number(c.price).toFixed(2)} &middot; comprata il ${new Date(c.purchase_date).toLocaleDateString('it-IT')} &middot; ${c.num_voti} voti</div>
          </div>
          <div class="score-num">${c.overall_score ?? '—'}<br><small>/ 10</small></div>
          ${bubbleMeter(c.overall_score ?? 0)}
        </div>
        <div class="detail" id="d-${c.id}">
          <table>
            <thead>
              <tr><th>Persona</th><th>Gusto</th><th>Retrog.</th><th>Frizz.</th><th>Overall</th><th>Nota</th></tr>
            </thead>
            <tbody>${detailRows || '<tr><td colspan="6">Nessun voto individuale.</td></tr>'}</tbody>
          </table>
        </div>
      `;
    }).join('');
  }

  loadBoard();
</script>
</body>
</html>
